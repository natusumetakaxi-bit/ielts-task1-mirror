*{box-sizing:border-box}

body{margin:0}
button,select,textarea{font:inherit}
button{cursor:pointer}
.app-shell{max-width:1100px;min-height:100vh;margin:auto;background:#f7fafc}

.brand-mark{display:flex;align-items:end;gap:4px;width:40px;height:40px;padding:7px;border:1px solid #557189;border-radius:12px;flex:none}

.brand-mark span:nth-child(1){height:12px}.brand-mark span:nth-child(2){height:20px}.brand-mark span:nth-child(3){height:28px}
.mode-nav{display:flex;gap:8px;padding:12px 24px;background:#102a43}

.content{padding:24px 24px 40px}

.count{color:#51697c;font-weight:700;white-space:nowrap}

.chinese{font-size:1.14rem;line-height:1.65;margin:0 0 18px;color:#34516a}
.variants{font-size:.95rem;color:#496a7e;line-height:1.55;margin:-5px 0 18px}
.study-block{padding-top:16px;border-top:1px solid #e0e9ef;margin-top:16px}
.study-block h3{font-size:.92rem;color:#506a7f;margin:0 0 7px}

.example-en{font-weight:650;color:#17324a}
.example-zh{margin-top:7px!important;color:#586f80}
.card-actions,.step-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.dictation-actions{justify-content:space-between;flex-wrap:nowrap}.dictation-actions .button{min-width:120px}
.button{border:1px solid #a9c0ce;border-radius:10px;background:#fff;color:#17324a;padding:10px 16px;font-weight:750;min-height:44px}
.button.primary{background:#0a6779;border-color:#0a6779;color:#fff}
.button.gold{background:#f3bc56;border-color:#f3bc56;color:#102a43}
.button:disabled{opacity:.45;cursor:not-allowed}
.step-actions{justify-content:space-between}
.step-actions .button{min-width:104px}
.progress{height:6px;border-radius:6px;background:#e5eef3;margin:17px 0 0;overflow:hidden}
.progress span{display:block;height:100%;background:#0a8794;border-radius:6px}
.prompt-title{font-size:.9rem;letter-spacing:.05em;color:#537186;font-weight:800;margin:0 0 12px}
.dictation-prompt{font-size:1.26rem;line-height:1.55;font-weight:800;color:#102a43;margin:0 0 10px}
.hint{font-size:.92rem;line-height:1.55;color:#5c7484;margin:0 0 18px}
.answer-label{display:block;font-weight:800;margin:14px 0 8px}
.answer-input{display:block;width:100%;min-height:100px;border:1px solid #a9c0ce;border-radius:12px;padding:13px 14px;background:#fbfdfe;color:#102a43;line-height:1.55;resize:vertical}
.feedback{margin-top:18px;border:1px solid #a9c0ce;border-left:5px solid #0a8794;border-radius:10px;background:#f1f8fa;padding:14px 16px;line-height:1.58}
.feedback.near{border-left-color:#df9a2d;background:#fff7e8}.feedback.retry{border-left-color:#d46b5b;background:#fff4f2}
.feedback.missing{border-left-color:#d46b5b;background:#fff4f2}
.feedback strong{display:block;margin-bottom:5px}.feedback p{margin:5px 0}.feedback .reference{font-weight:750;color:#102a43}
.accepted-heading{font-weight:800;color:#17324a;line-height:1.5}.accepted-list{margin:5px 0 0;padding-left:1.4rem}.accepted-list li{margin:4px 0;font-weight:700}
.storage-warning{margin:12px 0 0;color:#a74336;font-weight:700;line-height:1.5}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 18px}.stat{background:#fff;border:1px solid #ccdae5;border-radius:13px;padding:13px 16px;display:flex;align-items:baseline;gap:9px}.stat strong{font-size:1.55rem;color:#102a43}.stat span{color:#577085;font-weight:750}
.review-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px}.review-heading p{color:#51697c;font-weight:700;margin:0}
.review-group{margin:0 0 14px;padding:18px 22px}.review-group h3{font-size:1rem;color:#103850;margin:0 0 8px}.review-group h3 span{color:#60778a;font-size:.86rem;margin-left:7px}
.review-item{border-top:1px solid #e0e9ef;padding:14px 0}.review-item:last-child{padding-bottom:0}.review-item-top,.review-item-foot{display:flex;justify-content:space-between;align-items:center;gap:12px}.review-item-top strong{line-height:1.55}.review-item .accepted-heading{margin:7px 0;font-size:.93rem;overflow-wrap:anywhere}.last-answer{color:#a74336;margin:6px 0;font-size:.93rem;overflow-wrap:anywhere}.review-item-foot small{color:#657d8d;line-height:1.5}.review-item-foot .button{padding:7px 11px;min-height:36px;white-space:nowrap}
.caution-card{margin:13px 0;padding:15px;border:1px solid #e7c883;border-left:5px solid #d49b36;border-radius:11px;background:#fffaf0}
.caution-card h4{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px;color:#744a0b;font-size:1rem}
.caution-card h4 span{font-size:.88rem;white-space:nowrap}.caution-card p{margin:8px 0;line-height:1.6;color:#4e4332;overflow-wrap:anywhere}.caution-card label{display:block;margin:13px 0 6px;font-weight:800;color:#744a0b}
.caution-card textarea{display:block;width:100%;min-height:68px;padding:10px 12px;border:1px solid #d6ba80;border-radius:8px;background:#fff;color:#17324a;line-height:1.5;resize:vertical}
.caution-card small{display:block;margin-top:6px;color:#73675a;line-height:1.45}
.fineprint{font-size:.84rem;line-height:1.55;color:#657d8d;margin:12px 0 0}
.group-tabs{display:flex;gap:7px;overflow:auto;margin:0 0 16px;padding-bottom:2px}
.group-tab{border:1px solid #b7cbd7;border-radius:999px;background:#fff;color:#38586e;white-space:nowrap;padding:8px 14px;font-weight:750}
.group-tab.active{background:#103850;color:#fff;border-color:#103850}
.template-pattern{font-size:1.25rem;line-height:1.6;font-weight:780;color:#102a43;margin:18px 0}
.paragraphs{margin-top:18px}
.paragraphs summary{font-weight:800;color:#0a6779;cursor:pointer;padding:10px 0}
.paragraphs p{margin:10px 0;line-height:1.65;color:#34516a}
.principles{margin-top:18px}.principles summary{font-weight:800;color:#0a6779;cursor:pointer;padding:8px 0}.principles ul{padding-left:1.25rem;margin:9px 0 0}.principles li{line-height:1.65;margin:6px 0;color:#34516a}
dialog{width:min(92vw,440px);border:1px solid #ccdae5;border-radius:18px;padding:25px;color:#17324a;box-shadow:0 22px 60px rgba(16,42,67,.22)}dialog::backdrop{background:rgba(16,42,67,.55)}dialog h2{font-size:1.3rem;margin:0 34px 8px 0}dialog p{color:#51697c;line-height:1.6}dialog label{display:block;font-weight:800;margin:17px 0 7px}dialog input{display:block;width:100%;min-height:47px;border:1px solid #aac0cf;border-radius:10px;padding:10px 12px;font:inherit}dialog .button{margin-top:16px;width:100%}.dialog-close{position:absolute;right:17px;top:13px;border:0;background:transparent;color:#51697c;font-size:1.6rem;line-height:1;cursor:pointer}#offline-status{min-height:1.5em;font-size:.92rem;margin-bottom:0}
.empty{padding:30px;text-align:center}

    const text = value => new TextDecoder().decode(decode(value));
    document.getElementById('portable-form').addEventListener('submit', async event => {
      event.preventDefault();
      const status = document.getElementById('portable-status');
      const password = document.getElementById('portable-password');
      status.textContent = '正在解锁…';
      try {
        if (document.getElementById('portable-user').value !== 'penguin') throw Error('username');
        if (!crypto?.subtle) throw Error('crypto');
        const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.value), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:decode(bundle.salt), iterations:250000, hash:'SHA-256' }, material, { name:'AES-GCM', length:256 }, false, ['decrypt']);
        const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:decode(bundle.iv) }, key, decode(bundle.data));
        const content = JSON.parse(new TextDecoder().decode(plain));
        if (!Array.isArray(content.vocabulary) || !Array.isArray(content.templates)) throw Error('content');
        window.__offlineContent = content;
        if (cloudSync) window.__ieltsSync = { mode:'bearer', endpoint:syncEndpoint, token:password.value };
        password.value = '';
        document.getElementById('portable-login').hidden = true;
        document.getElementById('portable-study').hidden = false;
        const script = document.createElement('script');
        script.textContent = text(appBase64);
        document.body.append(script);
      } catch (error) {
        status.textContent = error.message === 'crypto' ? '此浏览器无法解锁本地文件。请改用 Chrome、Edge 或 Safari 打开。' : '登录名或离线解锁密码不正确。';
        password.value = '';
        password.focus();
      }
    });
    document.getElementById('portable-lock').addEventListener('click', () => location.reload());
  })();
  </script>
</body>
